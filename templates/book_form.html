{% extends "base.html" %}{% block body %}
<form method="post" enctype="multipart/form-data" class="card"><h1>{{ 'Edit book' if book else 'Add a book' }}</h1>
<fieldset class="modes"><legend>How do you want to fill in this book?</legend>
<label class="inline"><input type="radio" name="fill_mode" value="manual" checked>Fill fields manually</label>
<label class="inline"><input type="radio" name="fill_mode" value="auto">Fill fields automatically</label>
<label class="inline"><input type="checkbox" name="author_blank" id="author_blank" {{ 'checked' if book and not book['author'] or book and book['author']=='Unknown' }}>Leave author blank</label>
<p class="muted" id="modehelp"></p></fieldset>
<label for="title">Title *</label><div class="dd-wrap"><input id="title" type="text" name="title" autocomplete="off" value="{{ book['title'] if book }}" required><div class="dd" id="dd-title" role="listbox"></div></div>
<input type="hidden" name="cover_url" id="cover_url">
<label for="author">Author</label><div class="dd-wrap"><input id="author" type="text" name="author" autocomplete="off" value="{{ book['author'] if book and book['author']!='Unknown' }}"><div class="dd" id="dd-author" role="listbox"></div></div>
<div class="row"><div><label for="language">Language *</label><select id="language" name="language" required>
{% for l in LANGS %}<option {{ 'selected' if book and book['language']==l }}>{{ l }}</option>{% endfor %}</select></div>
<div><label for="year">Year of print</label><input id="year" type="text" name="year" value="{{ book['year'] if book }}"></div>
<div><label for="theme">Theme</label><select id="theme" name="theme"><option value="">–</option>
{% for t in THEMES %}<option {{ 'selected' if book and book['theme']==t }}>{{ t }}</option>{% endfor %}</select></div></div>
<label for="cover">Picture of the book</label><input id="cover" type="file" name="cover" accept="image/*">
<label for="info">Additional information</label><textarea id="info" name="info" rows="3">{{ book['info'] if book }}</textarea>
<label>Available to</label>{% for m in METHODS %}<label class="inline"><input type="checkbox" name="methods" value="{{ m }}" {{ 'checked' if (book and m in book['methods'].split(',')) or (not book and m=='Borrow') }}>{{ m }}</label>{% endfor %}
<label for="loc">Pick-up location *</label>
{% if locs %}<select id="loc" name="location_id">{% for l in locs %}<option value="{{ l['id'] }}" {{ 'selected' if book and book['location_id']==l['id'] }}>{{ l['name'] ~ ' – ' if l['name'] }}{{ l['address'] }}</option>{% endfor %}</select>
{% else %}<p>Add a location in <a href="{{ url_for('profile') }}">your profile</a> first.</p>{% endif %}
<p><button>Save book</button> <a class="btn alt" href="{{ url_for('library') }}">Cancel</a></p></form>
<script>
const $=id=>document.getElementById(id);
const titleIn=$('title'),authorIn=$('author'),yearIn=$('year'),coverUrl=$('cover_url'),blank=$('author_blank');
const fill=()=>document.querySelector('input[name=fill_mode]:checked').value;

// Reusable dropdown: fetchItems(text) -> {error, items, empty?}; render(item) -> label; pick(item)
function dropdown(input, box, fetchItems, render, pick, minChars){
  let items=[], active=-1, timer, ctrl;
  const hide=()=>{box.style.display='none';active=-1};
  const say=msg=>{box.innerHTML='<div class="dd-msg">'+msg+'</div>';box.style.display='block'};
  function draw(){
    box.innerHTML='';
    items.forEach((it,i)=>{const d=document.createElement('div');d.className='dd-item'+(i===active?' on':'');
      d.setAttribute('role','option');d.textContent=render(it);
      d.addEventListener('mousedown',e=>{e.preventDefault();choose(i)});box.appendChild(d)});
    box.style.display='block';
  }
  function choose(i){const it=items[i];hide();pick(it)}
  async function run(){
    if(input.disabled){hide();return}
    const text=input.value.trim(), need=typeof minChars==='function'?minChars():minChars;
    if(text.length<need){hide();return}
    if(ctrl)ctrl.abort();ctrl=new AbortController();say('Searching…');
    try{
      const r=await fetchItems(text,ctrl.signal);
      if(r.error){say('Couldn’t reach Open Library. Check your internet connection.');return}
      items=r.items;active=-1;items.length?draw():say(r.empty||'No matches found');
    }catch(e){if(e.name!=='AbortError')say('Something went wrong. Please try again.')}
  }
  input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,300)});
  input.addEventListener('keydown',e=>{
    if(box.style.display!=='block'||!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();active=(active+1)%items.length;draw()}
    else if(e.key==='ArrowUp'){e.preventDefault();active=(active-1+items.length)%items.length;draw()}
    else if(e.key==='Enter'&&active>=0){e.preventDefault();choose(active)}
    else if(e.key==='Escape')hide();
  });
  input.addEventListener('blur',()=>setTimeout(hide,150));
  return {run,hide};
}
const getJSON=async(url,signal)=>(await fetch(url,{signal})).json();

// Title: manual = fills only the title; automatic = fills every empty field we have data for
dropdown(titleIn,$('dd-title'),
  (q,s)=>getJSON('/api/lookup?q='+encodeURIComponent(q),s),
  b=>b.title+(b.author?' – '+b.author:'')+(b.year?' ('+b.year+')':''),
  b=>{titleIn.value=b.title;
      if(fill()==='auto'){
        if(b.year&&!yearIn.value)yearIn.value=b.year;
        coverUrl.value=b.cover||'';
        if(b.author&&!blank.checked&&!authorIn.value)authorIn.value=b.author;
      }else coverUrl.value=''},2);

// Author: suggests names matching what you type (never fills other fields).
// In automatic mode, clicking the empty box lists the authors of the title above.
const authorDD=dropdown(authorIn,$('dd-author'),
  async (q,s)=>{
    if(q.length>=2)return getJSON('/api/authors?q='+encodeURIComponent(q),s);
    const ti=titleIn.value.trim();
    if(fill()==='auto'&&ti.length>=2)return getJSON('/api/authors?title='+encodeURIComponent(ti),s);
    return {error:false,items:[],empty:fill()==='auto'?'Type the title first, or start typing an author.':'Keep typing to see author suggestions.'};
  },
  name=>name,name=>{authorIn.value=name},()=>fill()==='auto'?0:2);
authorIn.addEventListener('focus',()=>{if(fill()==='auto'&&!authorIn.value.trim())authorDD.run()});

function sync(){
  authorIn.disabled=blank.checked;
  if(blank.checked)authorIn.value='';
  authorIn.placeholder=blank.checked?'Will show as “Unknown”':'';
  $('modehelp').textContent=fill()==='auto'
    ?'Pick a suggestion for the title and we’ll fill in the other fields we have data for.'
    :'Suggestions help you spell the title or author, but nothing else is filled in for you.';
  if(fill()==='manual')coverUrl.value='';
}
document.querySelectorAll('input[name=fill_mode]').forEach(r=>r.addEventListener('change',sync));
blank.addEventListener('change',sync);sync();
</script>{% endblock %}
